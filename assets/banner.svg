<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="OpenCode Go Advisor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#22d3a6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" rx="18" fill="url(#bg)"/>

  <!-- textura sutil -->
  <g fill="#7aa2ff" opacity="0.14">
    <circle cx="640" cy="40" r="2"/><circle cx="680" cy="70" r="2"/><circle cx="720" cy="40" r="2"/>
    <circle cx="760" cy="70" r="2"/><circle cx="640" cy="100" r="2"/><circle cx="680" cy="130" r="2"/>
    <circle cx="720" cy="100" r="2"/><circle cx="760" cy="130" r="2"/><circle cx="640" cy="160" r="2"/>
    <circle cx="680" cy="190" r="2"/><circle cx="720" cy="160" r="2"/><circle cx="760" cy="190" r="2"/>
  </g>

  <!-- bloques decorativos -->
  <rect x="822" y="66" width="46" height="46" rx="9" fill="#5b8def" opacity="0.92"/>
  <rect x="878" y="66" width="46" height="46" rx="9" fill="#22d3a6" opacity="0.92"/>
  <rect x="822" y="122" width="102" height="14" rx="7" fill="#2b3a5c"/>
  <rect x="822" y="146" width="70" height="14" rx="7" fill="#22304d"/>

  <text x="60" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">OpenCode Go Advisor</text>
  <text x="62" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9db2d0">El mejor modelo de OpenCode Go para cada tarea — sin adivinar</text>
  <rect x="62" y="164" width="190" height="6" rx="3" fill="url(#accent)"/>
</svg>
